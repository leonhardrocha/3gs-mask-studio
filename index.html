<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Splatting Paint</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <!-- Render target. The id is referenced by src/main.mjs. -->
    <canvas id="application-canvas"></canvas>

    <!-- Lightweight control panel (replaces the examples-browser React/PCUI UI). -->
    <aside id="controls" aria-label="Controles">
        <header class="panel-title">Splatting Select</header>
        <p class="hint">
            <b>Botão direito</b> seleciona &nbsp;·&nbsp; <b>Shift</b> inverte o modo
            &nbsp;·&nbsp; <b>Botão esquerdo</b> orbita &nbsp;·&nbsp; <b>Alt+L</b> labels
        </p>
        <!-- Control groups are generated by src/controls.mjs -->
        <div id="controls-body"></div>
    </aside>

    <script type="module" src="/src/main.mjs"></script>
</body>
</html>
